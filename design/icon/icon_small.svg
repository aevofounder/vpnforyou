<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C7DF5"/>
      <stop offset="0.55" stop-color="#2F5BD3"/>
      <stop offset="1" stop-color="#1B2C78"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="0.3" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFE9FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <filter id="shieldShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0B1440" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <clipPath id="shieldClip">
      <path id="shieldPath" d="M512 232 C600 272 690 282 760 282 L760 502 C760 662 650 752 512 802 C374 752 264 662 264 502 L264 282 C334 282 424 272 512 232 Z"/>
    </clipPath>
  </defs>

  <!-- macOS icon body: 824×824 squircle with a 100 px margin -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bgGlow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- glass shield -->
  <g filter="url(#shieldShadow)">
    <path d="M512 232 C600 272 690 282 760 282 L760 502 C760 662 650 752 512 802 C374 752 264 662 264 502 L264 282 C334 282 424 272 512 232 Z" fill="url(#glass)"/>
  </g>
  <g clip-path="url(#shieldClip)">
    <ellipse cx="380" cy="300" rx="300" ry="190" fill="url(#sheen)"/>
  </g>
  <path d="M512 232 C600 272 690 282 760 282 L760 502 C760 662 650 752 512 802 C374 752 264 662 264 502 L264 282 C334 282 424 272 512 232 Z" fill="none" stroke="url(#edge)" stroke-width="16" stroke-linejoin="round"/>

  <!-- route: Mac → server → internet, drawn as a V -->
  <path d="M398 418 L512 628 L626 418" fill="none" stroke="#9FD8FF" stroke-opacity="0.85" stroke-width="80" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M398 418 L512 628 L626 418" fill="none" stroke="url(#route)" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="398" cy="418" r="54" fill="#FFFFFF"/>
  <circle cx="398" cy="418" r="20" fill="#2F5BD3"/>
  <circle cx="626" cy="418" r="54" fill="#FFFFFF"/>
  <circle cx="626" cy="418" r="20" fill="#2F5BD3"/>
  <circle cx="512" cy="628" r="64" fill="#FFFFFF"/>
  <circle cx="512" cy="628" r="26" fill="#2F5BD3"/>
</svg>
