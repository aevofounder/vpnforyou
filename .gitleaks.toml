# Настройки сканера секретов gitleaks (https://github.com/gitleaks/gitleaks).
# Запускается в GitHub Actions на каждый push и pull request
# (.github/workflows/secret-scan.yml). Ловит стандартные секреты
# (токены, приватные ключи и т.п.) плюс ключи VPN, которых нет в
# стандартных правилах.

title = "vpnforyou"

[extend]
useDefault = true

# Ссылки-ключи из сервисов VPN: vless://, vmess://, trojan://, ss:// и т.д.
[[rules]]
id = "vpn-share-link"
description = "Ключ VPN/прокси в виде ссылки (vless://, vmess://, trojan://, ss://, hysteria2://, tuic://...)"
regex = '''(?i)\b(?:vless|vmess|trojan|ss|ssr|hysteria|hysteria2|hy2|tuic|anytls|wireguard|wg)://[A-Za-z0-9+/=_%.:@\-\[\]?&#!~*,;]{12,}'''
keywords = ["://"]

# Тестовые ссылки разрешены, только если сервер — зарезервированный
# «ненастоящий» адрес: example.com/net/org (RFC 2606) или тестовые
# IP-сети 192.0.2.0/24, 198.51.100.0/24, 203.0.113.0/24 (RFC 5737),
# 2001:db8::/32 (RFC 3849).
[[rules.allowlists]]
regexTarget = "match"
regexes = [
  '''@(?:[a-z0-9-]+\.)*example\.(?:com|net|org)(?:[:/?#]|$)''',
  '''@(?:192\.0\.2|198\.51\.100|203\.0\.113)\.\d{1,3}(?:[:/?#]|$)''',
  '''@\[2001:db8:''',
]

# UUID пользователя в JSON-конфигах sing-box / Xray.
[[rules]]
id = "vpn-config-uuid"
description = "UUID пользователя VPN в конфиге"
regex = '''(?i)"uuid"\s*:\s*"([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"'''
secretGroup = 1
keywords = ["uuid"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^0{8}-0{4}-0{4}-0{4}-0{12}$''']

# Пароли в JSON-конфигах (trojan, shadowsocks, hysteria2, tuic...).
[[rules]]
id = "vpn-config-password"
description = "Пароль VPN/прокси в конфиге"
regex = '''(?i)"(?:password|auth_str|psk|pre_shared_key)"\s*:\s*"([^"]{6,})"'''
secretGroup = 1
keywords = ["password", "auth_str", "psk", "pre_shared_key"]

[[rules.allowlists]]
regexTarget = "secret"
regexes = ['''^(?:test|fake|example|placeholder|dummy)[-_a-z0-9]*$''']

# Приватный ключ WireGuard (32 байта в base64).
[[rules]]
id = "wireguard-private-key"
description = "Приватный ключ WireGuard"
regex = '''(?i)private_?key"?\s*[=:]\s*"?([A-Za-z0-9+/]{42}[AEIMQUYcgkosw048]=)'''
secretGroup = 1
keywords = ["private"]
