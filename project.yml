# Проект Xcode генерируется из этого файла: xcodegen generate
# (сам .xcodeproj в git не хранится).
name: VPNforYou

options:
  bundleIdPrefix: io.github.aevofounder
  # The interface is Russian: system formatters (bytes, dates) follow it.
  developmentLanguage: ru
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Public half of the update signing key (Ed25519, base64). CI passes it
    # from the repository variable SPARKLE_PUBLIC_KEY; empty = no updates.
    SPARKLE_PUBLIC_KEY: ""
    SWIFT_VERSION: "5.0"

packages:
  VPNCore:
    path: Packages/VPNCore
  # Auto-updates. Pinned to the commit of tag 2.9.6; SwiftPM also checks
  # the binary's checksum from that commit's Package.swift.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    revision: ac2def288cbff5cfc7df3ffef6abdf45b72bcb0a

targets:
  VPNforYou:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: VPNCore
        product: VPNCore
      - package: VPNCore
        product: VPNHelperCore
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: ru
        CFBundleLocalizations: [ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Beta channel: CI publishes a signed build after every merge to main.
        SUFeedURL: https://github.com/aevofounder/vpnforyou/releases/download/beta/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_NAME: VPNforYou
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aevofounder.vpnforyou
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: VPNforYou
        # Приложение живёт в строке меню, без иконки в Dock.
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "GPL-3.0-or-later"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Без аккаунта Apple Developer: ad-hoc подпись.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      gatherCoverageData: false
